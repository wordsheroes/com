<!DOCTYPE html>    
<html lang="fr">    
<head>    
<meta charset="UTF-8">    
<meta name="viewport" content="width=device-width, initial-scale=1.0">    
<title>Boutique En Ligne</title>    
<style>    
body{    
    margin:0;    
    font-family: Arial, sans-serif;    
    background:#d9ecff;    
}    

/* BARRE SUPÉRIEURE */
.topbar {
    background: #2b6cb0;
    padding: 15px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    box-sizing: border-box;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    flex-shrink: 0;
}

.search {
    width: 45%;
    max-width: 300px;
}

.search input {
    width: 100%;
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    box-sizing: border-box;
}

/* BARRE DES CATÉGORIES */
.categories{
    background:#f5c542;
    display:flex;
    gap:15px;
    padding:10px;
    overflow:auto;
}

.categories button{
    border:none;
    background:white;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
    white-space: nowrap;
}

/* CONTENU PRINCIPAL */
.container{
    padding:20px;
}

.banner{
    background:white;
    border-radius:10px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.banner h1{
    color:#2b6cb0;
    margin-top: 0;
}

.cards{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card-content h3{
    margin:0;
    color: #333;
}

.card-content p{
    color:#2b6cb0;
    font-weight: bold;
    font-size: 18px;
    margin: 10px 0;
}

/* تنسيق وسم الروابط ليصبح زراً منسقاً بالكامل */
.buy-link {
    display: block;
    text-align: center;
    text-decoration: none;
    margin-top:10px;
    background:#2b6cb0;
    color:white;
    border:none;
    padding:12px;
    border-radius:5px;
    font-weight: bold;
    transition: background 0.2s;
}

.buy-link:hover {
    background: #1d4ed8;
}

/* FOOTER */
.footer-line {
    border: none;
    border-top: 2px solid #2b6cb0;
    margin-top: 40px;
    opacity: 0.7;
}

.simple-footer {
    text-align: center;
    padding: 20px;
    color: #2b6cb0;
    font-weight: bold;
    font-size: 14px;
}

.footer-link {
    color: #2b6cb0;
    text-decoration: none;
    margin-left: 10px;
    border-bottom: 1px dashed #2b6cb0;
    transition: color 0.2s ease;
}

.footer-link:hover {
    color: #f5c542;
    border-bottom-color: #f5c542;
}
</style>

</head>    
<body>    

<div class="topbar">    
    <div class="logo">Marketplace</div>    
    <div class="search">    
        <input type="text" placeholder="Rechercher des produits...">    
    </div>  
</div>    

<div class="categories">    
    <button>ÉLECTRONIQUE</button>    
    <button>MODE</button>    
    <button>MAISON</button>    
    <button>BEAUTÉ</button>    
    <button>AUTOS</button>    
    <button>OFFRES</button>    
</div>    

<div class="container">    
    <div class="banner">    
        <h1>BIENVENUE SUR NOTRE BOUTIQUE</h1>    
        <p>Produits Premium, Livraison Rapide dans le Monde Entier</p>    
    </div>    

    <div class="cards">    
        <div class="card">    
            <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1200&auto=format&fit=crop">    
            <div class="card-content">    
                <h3>Super Car</h3>    
                <p>2 500 000 €</p>    
                <a href="supercar.html" class="buy-link">Afficher plus</a>    
            </div>    
        </div>    

        <div class="card">    
            <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1200&auto=format&fit=crop">    
            <div class="card-content">    
                <h3>Coupe de Luxe</h3>    
                <p>950 000 €</p>    
                <a href="coupe.html" class="buy-link">Afficher plus</a>    
            </div>    
        </div>    
    </div>
</div>    

<hr class="footer-line">  
<footer class="simple-footer">  
    <p>
        Tout droits réservés © 2026. | 
        <a href="terms.html" class="footer-link">Conditions Générales d'Utilisation</a>
    </p>  
</footer>  

</body>    
</html>
